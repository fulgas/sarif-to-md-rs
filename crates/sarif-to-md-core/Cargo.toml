[package]
name = "sarif-to-md-core"
version = "1.6.0"
edition = "2021"
authors = ["Nelson Silva <nelson.emanuel.silva@gmail.com>"]
description = "Core library for converting SARIF security reports to Markdown."
license = "MIT OR Apache-2.0"
repository = "https://github.com/fulgas/sarif-to-md-rs"
keywords = ["sarif", "security", "vulnerability", "markdown", "reporting"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.95"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "sarif_to_md_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive", "default"] }
serde_json = "1.0.151"
serde-sarif = {  version = "0.8.0", features = ["anyhow"] }
askama = { version = "0.16.1"}
thiserror = "2.0.20"
jiff = { version = "1.0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "=3.27.0"
rstest = "=0.29.0"
anyhow = "=1.0.105"
rustup-toolchain = "=0.1.10"
rustdoc-json = "=0.9.10"
public-api = "=0.52.2"
insta = "=1.49.0"
