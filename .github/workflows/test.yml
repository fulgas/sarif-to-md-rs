name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Stable on all platforms
          - os: ubuntu-latest
            rust-version: stable
            coverage: true
          - os: macos-latest
            rust-version: stable
          - os: windows-latest
            rust-version: stable
          # Beta and MSRV only on Ubuntu
          - os: ubuntu-latest
            rust-version: beta
          - os: ubuntu-latest
            rust-version: 1.95.0  # MSRV

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain (${{ matrix.rust-version }})
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust-version }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          key: ${{ matrix.rust-version }}-nextest

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        if: matrix.coverage
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with nextest
        run: cargo nextest run --verbose

      - name: Check benchmark compilation
        run: cargo bench --no-run

      - name: Check documentation builds
        run: cargo doc --no-deps --document-private-items

      - name: Generate code coverage
        if: matrix.coverage
        run: cargo llvm-cov nextest --all-features --workspace --cobertura --output-path cobertura.xml

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Code Coverage Summary Report
        if: matrix.coverage && github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
